                                                                                                                                                                                                <div class="cap-group" id="cap-309">He contributed $250,000, the equivalent</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-310">of $9 million in modern</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-311">money, the largest single political</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-312">contribution in American history at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-313">the time.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-314">It came without a public</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-315">announcement and without a public</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-316">acknowledgement.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-317">Rockefeller paid.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-318">Hannah recorded the receipt.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-319">Both men understood what had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-320">been bought.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-321">Carnegie Steel paid second.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-322">Other steel firms followed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-323">Then the railroads, the Pennsylvania,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-324">the New York Central, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-325">Baltimore, and Ohio.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-326">Then the insurance houses, New</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-327">York Life, Equitable Mutual, then</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-328">the banks.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-329">By August, every major financial</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-330">institution in the Northeast had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-331">paid its assessment.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-332">The total raised was at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-333">least $3.5 million.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-334">Some estimates run to 10</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-335">million.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-336">Either figure dwarfed every previous</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-337">American campaign.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-338">William Jennings Bryan, the Democratic</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-339">nominee, raised somewhere between 300,000</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-340">and $675,000 in the same</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-341">period.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-342">Hannah outspent him 20 to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-343">one.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-344">The money was not collected</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-345">for graft.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-346">Every dollar went into the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-347">campaign.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-348">pamphlets, posters, train tickets, hotel</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-349">bills, telegrams, surrogate speakers, mailings,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-350">billboards.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-351">Hannah ran a public information</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-352">operation, not a slush fund.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-353">The point was scale.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-354">What Hannah had built was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-355">a financial machine.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-356">System that connected the largest</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-357">corporations in the country directly</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-358">to the Republican National Committee</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-359">through a recurring assessment, payable</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-360">on demand, owed in proportion</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-361">to size.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-362">It was a tax.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-363">The companies paid because Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-364">told them to.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-365">They paid because Hannah had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-366">been a businessman in Cleveland</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-367">for 30 years and knew</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-368">exactly which executive at which</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-369">firm could authorize a check</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-370">on which day.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-371">And they paid because the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-372">alternative was Bryan winning.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-373">Bryan wanted to coin silver</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-374">alongside gold.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-375">The bankers ran the numbers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-376">Under his plan, every dollar</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-377">in every American bank would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-378">buy half as much by</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-379">inauguration day.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-380">Every loan they had made</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-381">would come back in cheaper</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-382">money.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-383">The men who held the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-384">country's debts would become the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-385">men who absorbed the country's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-386">losses.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-387">For the people Hannah was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-388">writing to, that was not</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-389">a policy disagreement.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-390">It was the end of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-391">their world.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-392">After 1896, every major American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-393">political party copied the assessment</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-394">system.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-395">The names changed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-396">The mechanism did not, but</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-397">raising the money was the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-398">easy part.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-399">Hannah had four months to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-400">spend it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-401">Hannah called the campaign an</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-402">education.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-403">Educating 76 million Americans in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-404">four months means industrial scale.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-405">The Republican National Committee printed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-406">200 million pamphlets in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-407">four months between June and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-408">November, 200 million.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-409">The American population in 1896</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-410">was 76 million.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-411">Hannah mailed every adult voter</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-412">the equivalent of four pamphlets</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-413">each.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-414">The literature was multilingual.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-415">He printed in German for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-416">the Pennsylvania and Wisconsin farmers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-417">He printed in Yiddish for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-418">the New York garment workers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-419">He printed in Spanish for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-420">the Southwest.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-421">He printed in Italian for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-422">the Eastern cities.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-423">He printed in Polish, Czech,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-424">Swedish, and Norwegian for the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-425">Upper Midwest.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-426">The English language pamphlets came</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-427">in dozens of variants.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-428">One for railway workers, one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-429">for factory hands, one for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-430">shopkeepers, one for farmers in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-431">silver mining states, and a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-432">different one for farmers in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-433">gold standard states.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-434">The campaign tracked which version</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-435">was sent to which county.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-436">Hannah deployed 1,400 surrogate speakers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-437">He paid their travel.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-438">He coordinated their schedules.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-439">He kept them on message.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-440">Every county in every battleground</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-441">state heard a Republican voice</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-442">in person before the November</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-443">vote.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-444">The candidate stayed home.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-445">McKinley refused to travel.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-446">He believed a presidential nominee</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-447">should not beg for votes</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-448">on a railroad platform.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-449">He told Hannah he would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-450">not campaign in the field.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-451">So Hannah brought the field</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-452">to him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-453">The Pennsylvania railroad, the Baltimore</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-454">and Ohio, and a dozen</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-455">other lines offered special excursion</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-456">fares to Canton, Ohio, population</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-457">30,000, roughly 300 miles from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-458">Washington, McKinley's hometown since the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-459">Civil War.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-460">Voters arrived from as far</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-461">as Maine and Nebraska.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-462">They walked from the train</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-463">station to the candidate's front</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-464">porch.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-465">McKinley spoke from his lawn.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-466">He shook every hand.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-467">By election day, three quarters</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-468">of a million Americans had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-469">stood in McKinley's front yard.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-470">Brian, meanwhile, traveled.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-471">The cross of gold speech</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-472">he had delivered at the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-473">Democratic Convention in Chicago on</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-474">July 9th, 1896, had made</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-475">him the youngest major party</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-476">nominee in American history.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-477">The speech demanded the free</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-478">coinage of silver to break</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-479">what Brian called the grip</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-480">of Eastern banks on Western</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-481">farmers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-482">He closed it on a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-483">thesis.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-484">You shall not crucify mankind</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-485">upon a cross of gold.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-486">The convention floor went silent</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-487">for five seconds, then erupted.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-488">He spent the next four</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-489">months on trains.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-490">He gave 600 speeches in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-491">27 states.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-492">He was magnificent in person.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-493">He was 36 years old</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-494">and could fill a stadium</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-495">with his voice alone.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-496">Hannah's response was tonnage, not</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-497">eloquence.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-498">While Brian thundered to crowds</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-499">of 10,000 at a time,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-500">Hannah delivered 200 million pieces</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-501">of mail.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-502">While Brian gave 600 speeches,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-503">Hannah deployed 1,400 speakers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-504">While Brian held one rally</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-505">per town, Hannah held one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-506">in every precinct.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-507">The contest was not between</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-508">two campaigners.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-509">It was between a man</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-510">and a machine.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-511">On November 3rd, the country</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-512">would tell them which it</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-513">preferred.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-514">The polls closed in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-515">East at six in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-516">evening on November 3rd, 1896.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-517">The first returns came in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-518">from Connecticut and New Hampshire.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-519">McKinley was running ahead of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-520">every Republican forecast.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-521">By midnight, the Northeast had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-522">broken for him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-523">By two in the morning,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-524">the Midwest had followed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-525">By dawn, the only states</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-526">still in question were in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-527">the silver mining West.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-528">McKinley took 271 electoral votes.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-529">Brian took 176.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-530">Popular vote was seven million,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-531">105,000, 76 to 6,370,897, a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-532">margin of more than 700,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-533">McKinley won by 5.3 percentage</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-534">points.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-535">The total turnout, 13.9 million</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-536">voters, was the highest by</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-537">share of eligible voters in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-538">any American presidential election since</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-539">the Civil War.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-540">He took Illinois, Indiana, and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-541">Ohio by tens of thousands.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-542">He took New York, New</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-543">Jersey, and Pennsylvania by hundreds</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-544">of thousands.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-545">He swept every Northeastern state.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-546">He swept the Midwestern industrial</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-547">belt.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-548">Brian won the South, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-549">Plains, and the silver mining</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-550">West and lost everything else.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-551">McKinley sent Hannah a telegram</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-552">on November 5th.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-553">The text was meant for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-554">public release.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-555">The people in their majesty,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-556">ignoring party lines, have declared</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-557">their detestation of repudiation and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-558">dishonor.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-559">The victory is not to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-560">party or section, but of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-561">and for the whole American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-562">people.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-563">The private letter that followed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-564">was different.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-565">McKinley wrote to Hannah alone,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-566">was there ever such unselfish</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-567">devotion before?</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-568">Your unfaltering and increasing friendship</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-569">through more than 20 years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-570">has been to me an</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-571">encouragement and a source of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-572">strength, which I am sure</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-573">you have never realized, but</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-574">which I have constantly felt,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-575">and for which I thank</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-576">you from the bottom of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-577">my heart.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-578">20 years.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-579">They had met in 1876.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-580">McKinley had been a young</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-581">congressman, Hannah, a young industrialist</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-582">looking for a candidate.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-583">The 1888 convention had been</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-584">12 years into the friendship.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-585">The 1896 campaign had been</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-586">the eighth year of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-587">project.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-588">McKinley remembered the math.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-589">He thanked Hannah for two</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-590">decades.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-591">Four nights after the election,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-592">on November 7th, 1896, Mark</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-593">Hannah hosted a private dinner</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-594">at the Hotel Waldorf in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-595">New York.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-596">He invited 31 men, every</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-597">newspaper reporter, who had covered</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-598">Republican headquarters in New York</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-599">and Chicago from June to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-600">November.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-601">He did not invite only</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-602">the friendly press.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-603">Brian's papers were there.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-604">Hearst's New York Journal was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-605">there, the paper whose Davenport</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-606">cartoons had spent the campaign</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-607">drawing Hannah in his dollar</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-608">sign suit.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-609">Republican and Democratic correspondents ate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-610">the same meal and received</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-611">the same gift.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-612">The gift was a medal</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-613">the size and weight of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-614">a $20 gold piece.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-615">On one side was the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-616">reporter's own name engraved.</div>
