                                                                                                                                                                                                                                                                                                                                                                                                <div class="cap-group" id="cap-0">The cartoon ran in every</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1">Hearst paper in 1896.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-2">A fat man in a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-3">suit covered in dollar signs,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-4">smoking a cigar the size</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-5">of his forearm.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-6">The caption changed every week.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-7">The man did not.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-8">His name was Mark Hannah.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-9">He built the machine that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-10">bought American elections.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-11">Mark Hannah was a Cleveland</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-12">iron and coal millionaire.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-13">59 years old, had never</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-14">run for office in his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-15">life.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-16">It was the first campaign</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-17">bought with corporate money at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-18">industrial scale.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-19">Hannah raised three and a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-20">half million dollars that year.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-21">He spent 20 times what</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-22">his opponents spent.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-23">He elected William McKinley, a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-24">wounded civil war major and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-25">two term Ohio governor, president</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-26">of the United States.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-27">Banks paid, railroads paid.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-28">Mark Hannah ran every dollar</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-29">of it from a rented</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-30">Manhattan office.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-31">It was bought.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-32">Standard oil paid first.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-33">Carnegie Steel paid second.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-34">Banks and insurance companies paid</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-35">in proportion to their capital.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-36">Hannah did not ask.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-37">He sent letters telling firms</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-38">what they owed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-39">No political consultant in American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-40">history has spent more, recruited</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-41">more or one bigger.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-42">Every campaign after 1896 copied</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-43">his playbook.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-44">This is the man who</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-45">built the operating system of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-46">American elections.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-47">This is the man nobody</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-48">remembers.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-49">Eight years later, he was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-50">dead at 66.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-51">The textbook revisions of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-52">interwar decades took his name</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-53">out of the standard curriculum.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-54">Today, his Wikipedia article averages</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-55">around 6,000 views a month.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-56">Theodore Roosevelt's averages over 300,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-57">How one man bought a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-58">presidency, how the country he</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-59">built forgot his name.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-60">Marcus Alonso Hannah was born</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-61">in 1837 in New Lisbon,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-62">Ohio.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-63">His father ran a country</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-64">store.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-65">In 1853, the family moved</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-66">to Cleveland.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-67">He went to Cleveland Central</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-68">High School.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-69">One of his classmates was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-70">a quiet, devout, ferociously disciplined</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-71">boy named John D.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-72">Rockefeller, the future founder of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-73">Standard Oil, who would in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-74">20 years control nine of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-75">every 10 gallons of refined</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-76">American oil.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-77">They sat in the same</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-78">room.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-79">They walked the same halls.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-80">43 years later, Rockefeller would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-81">write Hannah a check for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-82">$250,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-83">Hannah left college after one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-84">semester at Western Reserve, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-85">local Cleveland college two miles</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-86">from his house and went</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-87">into his father's wholesale grocery</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-88">business.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-89">By the end of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-90">civil war, he ran the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-91">firm.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-92">Then he married into iron.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-93">His father in law owned</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-94">one of the largest coal</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-95">and iron operations on the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-96">Great Lakes, boats, docks, foundry</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-97">contracts.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-98">Within a few years, Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-99">ran it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-100">By 1885, the company carried</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-101">his name.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-102">By 1880, Hannah sat on</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-103">the board of nine corporations.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-104">He owned the boats that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-105">moved iron ore down from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-106">the Lake Superior ranges, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-107">docks where they unloaded, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-108">railroad spurs that carried coal</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-109">to the foundries.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-110">He had a private rail</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-111">car.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-112">He had a winter house</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-113">in Georgia.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-114">He had a city to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-115">himself.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-116">By 1880, judging from the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-117">men he hired and the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-118">businesses he bought, Hannah had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-119">concluded that the federal government</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-120">was being auctioned off in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-121">pieces and that it could</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-122">not last unless someone organized</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-123">it from the top.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-124">What he did not have</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-125">yet was a candidate.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-126">And in the cornfields of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-127">Nebraska, a 36 year old</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-128">populist lawyer named William Jennings</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-129">Bryan was sharpening the speech</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-130">that would 16 years later,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-131">force Hannah to invent the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-132">modern campaign in four months</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-133">flat.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-134">The Republican National Convention opened</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-135">in Chicago on June 19th,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-136">1888.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-137">Hannah arrived as a delegate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-138">from Ohio working the floor</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-139">for John Sherman, the Senator</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-140">from his home state.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-141">Sherman was 65, brilliant, deeply</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-142">respected and unable to win.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-143">Hannah knew it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-144">He worked for him anyway.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-145">The convention deadlocked.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-146">Through six ballots, no candidate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-147">could break above 300 votes.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-148">The favored son from Indiana,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-149">Benjamin Harrison, civil war general,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-150">grandson of a former president</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-151">with no political constituency outside</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-152">Indiana hovered in second place.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-153">The party was looking for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-154">an alternative.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-155">On the convention floor, a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-156">delegation approached a 45 year</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-157">old congressman from Canton, Ohio</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-158">named William McKinley.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-159">They wanted him to allow</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-160">his name to be placed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-161">in nomination.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-162">McKinley had come to Chicago</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-163">pledged to John Sherman.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-164">He was Sherman's floor manager.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-165">He had been working all</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-166">week for the man Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-167">was working for.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-168">McKinley said no.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-169">He said it without pausing</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-170">to think about it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-171">He said it without consulting</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-172">his wife, his advisors or</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-173">his own ambition.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-174">He told the delegates that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-175">he was bound to Sherman</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-176">by a public pledge and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-177">would not break it for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-178">the most powerful office in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-179">the country.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-180">Hannah was watching from across</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-181">the floor.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-182">He saw the entire exchange.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-183">He saw a man turn</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-184">down the presidency of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-185">United States because he had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-186">given his word to a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-187">colleague who could not win.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-188">An industrialist remembers a man</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-189">like that.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-190">McKinley refused, Hannah remembered.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-191">Harrison won the nomination on</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-192">the eighth ballot and the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-193">presidency in November.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-194">Sherman went home.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-195">McKinley went back to his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-196">house seat.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-197">Hannah went back to Cleveland</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-198">with a decision in his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-199">pocket.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-200">The next Republican from Ohio</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-201">who reached the White House</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-202">would be William McKinley.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-203">And Hannah would put him</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-204">there.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-205">In January 1895, Hannah resigned</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-206">from active management of M.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-207">A Hannah and company, he</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-208">was 57 years old.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-209">He turned the iron and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-210">coal operation over to his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-211">brother and his cousins.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-212">He took his name off</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-213">the door in everything but</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-214">title.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-215">He walked away from business.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-216">He moved to New York</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-217">City and rented offices in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-218">Manhattan.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-219">He set up a second</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-220">headquarters in Chicago under a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-221">young Ohio attorney named Charles</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-222">Dawes.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-223">Dawes ran the field operation.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-224">Hannah ran the money.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-225">He began making lists.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-226">Lists of bankers in New</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-227">York.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-228">Lists of railroad presidents in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-229">Chicago.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-230">Lists of corporation heads from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-231">Pittsburgh to St.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-232">Louis.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-233">He began making appointments.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-234">He began calling on people</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-235">whose names had never appeared</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-236">on a campaign ledger before.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-237">He was building in a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-238">Wall Street office at 57</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-239">years old.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-240">The network he had wanted</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-241">at 35 and had never</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-242">been in a position to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-243">construct.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-244">He had four years to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-245">do it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-246">He believed he had three.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-247">The Republican National Convention opened</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-248">in St.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-249">Louis on June 16th, 1896.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-250">Two days later on the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-251">first ballot, the convention nominated</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-252">William McKinley for president of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-253">the United States.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-254">The vote was 661 to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-255">84.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-256">McKinley had been a candidate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-257">on paper for 11 days.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-258">He had been Hannah's candidate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-259">for eight years.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-260">The Republican National Committee elected</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-261">Hannah its chairman on June</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-262">19.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-263">He now controlled every dollar</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-264">the campaign would raise or</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-265">spend between June and November.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-266">He had four months.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-267">He had a country to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-268">organize and he had an</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-269">idea about how to do</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-270">it that no one had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-271">ever tried at scale.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-272">The mechanism was simple and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-273">entirely unprecedented in American politics.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-274">By July, 1896, Hannah had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-275">decided that banks and corporations</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-276">would be assessed for the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-277">campaign in proportion to their</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-278">capital.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-279">He settled on one quarter</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-280">of 1%, a bank with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-281">$20 million in capital owed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-282">50,000, a railroad with 200</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-283">million owed 500,000, small enough</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-284">to feel like a tax,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-285">large enough to fund a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-286">continent.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-287">He did not call it</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-288">a request.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-289">By every contemporary account, Hannah's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-290">approach was not a request.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-291">It was an assessment.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-292">The letter from Republican headquarters</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-293">did not ask whether the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-294">firm wished to support the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-295">campaign.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-296">It told the firm what</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-297">its share was.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-298">It named a date.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-299">It named an amount.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-300">It included payment instructions.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-301">Standard oil paid first.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-302">John D.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-303">Rockefeller paid first.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-304">Hannah's high school classmate at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-305">Cleveland Central 43 years earlier.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-306">Now in control of nine</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-307">of every 10 gallons of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-308">refined American oil.</div>
