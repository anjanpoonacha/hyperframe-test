                                                                                                <div class="cap-group" id="cap-0">The cartoon ran in every</div>
                                                <div class="cap-group" id="cap-1">Hearst paper in America.</div>
                                                <div class="cap-group" id="cap-2">A fat man, in a</div>
                                                <div class="cap-group" id="cap-3">suit covered in dollar signs,</div>
                                                <div class="cap-group" id="cap-4">smoking a cigar the size</div>
                                                <div class="cap-group" id="cap-5">of his forearm.</div>
                                                <div class="cap-group" id="cap-6">The caption changed every week.</div>
                                                <div class="cap-group" id="cap-7">The man did not.</div>
                                                <div class="cap-group" id="cap-8">His name was Mark Hanna.</div>
                                                <div class="cap-group" id="cap-9">And in eighteen ninety-six, he</div>
                                                <div class="cap-group" id="cap-10">did something no one had</div>
                                                <div class="cap-group" id="cap-11">ever done at that scale.</div>
                                                <div class="cap-group" id="cap-12">He turned the American presidential</div>
                                                <div class="cap-group" id="cap-13">election into a corporate purchase</div>
                                                <div class="cap-group" id="cap-14">order.</div>
                                                <div class="cap-group" id="cap-15">Three and a half million</div>
                                                <div class="cap-group" id="cap-16">dollars raised.</div>
                                                <div class="cap-group" id="cap-17">Twenty times what his opponent</div>
                                                <div class="cap-group" id="cap-18">spent.</div>
                                                <div class="cap-group" id="cap-19">Banks assessed at a quarter</div>
                                                <div class="cap-group" id="cap-20">of a percent of capital.</div>
                                                <div class="cap-group" id="cap-21">Railroads, shaken down personally.</div>
                                                <div class="cap-group" id="cap-22">Standard Oil, two hundred and</div>
                                                <div class="cap-group" id="cap-23">fifty thousand dollars.</div>
                                                <div class="cap-group" id="cap-24">JP Morgan, two hundred and</div>
                                                <div class="cap-group" id="cap-25">fifty thousand dollars.</div>
                                                <div class="cap-group" id="cap-26">Half a million voters, transported</div>
                                                <div class="cap-group" id="cap-27">by train, to shake one</div>
                                                <div class="cap-group" id="cap-28">man's hand.</div>
                                                <div class="cap-group" id="cap-29">Two hundred million pieces of</div>
                                                <div class="cap-group" id="cap-30">campaign literature, printed and mailed.</div>
                                                <div class="cap-group" id="cap-31">The opposition had a thirty-six</div>
                                                <div class="cap-group" id="cap-32">year old preacher who could</div>
                                                <div class="cap-group" id="cap-33">move a crowd to tears.</div>
                                                <div class="cap-group" id="cap-34">Hanna had a ledger.</div>
                                                <div class="cap-group" id="cap-35">And when November came, the</div>
                                                <div class="cap-group" id="cap-36">ledger won.</div>
                                                <div class="cap-group" id="cap-37">He wasn't born with money.</div>
                                                <div class="cap-group" id="cap-38">He was born in a</div>
                                                <div class="cap-group" id="cap-39">grocery.</div>
                                                <div class="cap-group" id="cap-40">New Lisbon, Ohio.</div>
                                                <div class="cap-group" id="cap-41">Eighteen thirty-seven.</div>
                                                <div class="cap-group" id="cap-42">His father, Doctor Leonard Hanna,</div>
                                                <div class="cap-group" id="cap-43">was a country physician who</div>
                                                <div class="cap-group" id="cap-44">ran a wholesale grocery on</div>
                                                <div class="cap-group" id="cap-45">the side.</div>
                                                <div class="cap-group" id="cap-46">Flour, salt, dry goods to</div>
                                                <div class="cap-group" id="cap-47">Ohio farmers.</div>
                                                <div class="cap-group" id="cap-48">When Mark was fifteen, the</div>
                                                <div class="cap-group" id="cap-49">family moved to Cleveland.</div>
                                                <div class="cap-group" id="cap-50">He enrolled at Western Reserve</div>
                                                <div class="cap-group" id="cap-51">College.</div>
                                                <div class="cap-group" id="cap-52">In his class, was a</div>
                                                <div class="cap-group" id="cap-53">quiet, awkward boy who would</div>
                                                <div class="cap-group" id="cap-54">grow up to control ninety</div>
                                                <div class="cap-group" id="cap-55">percent of the oil refining</div>
                                                <div class="cap-group" id="cap-56">capacity in the United States.</div>
                                                <div class="cap-group" id="cap-57">His name was John D.</div>
                                                <div class="cap-group" id="cap-58">Rockefeller.</div>
                                                <div class="cap-group" id="cap-59">The two would orbit each</div>
                                                <div class="cap-group" id="cap-60">other for the next forty</div>
                                                <div class="cap-group" id="cap-61">years.</div>
                                                <div class="cap-group" id="cap-62">Hanna lasted one year at</div>
                                                <div class="cap-group" id="cap-63">Western Reserve before he quit.</div>
                                                <div class="cap-group" id="cap-64">Not because he was failing.</div>
                                                <div class="cap-group" id="cap-65">Because he had already figured</div>
                                                <div class="cap-group" id="cap-66">out something the professors couldn't</div>
                                                <div class="cap-group" id="cap-67">teach.</div>
                                                <div class="cap-group" id="cap-68">The real education, was in</div>
                                                <div class="cap-group" id="cap-69">the price of things.</div>
                                                <div class="cap-group" id="cap-70">He went back to the</div>
                                                <div class="cap-group" id="cap-71">store.</div>
                                                <div class="cap-group" id="cap-72">Worked the floor.</div>
                                                <div class="cap-group" id="cap-73">Watched how men negotiated.</div>
                                                <div class="cap-group" id="cap-74">Watched who paid on time</div>
                                                <div class="cap-group" id="cap-75">and who didn't.</div>
                                                <div class="cap-group" id="cap-76">Watched which suppliers had leverage,</div>
                                                <div class="cap-group" id="cap-77">and which ones begged.</div>
                                                <div class="cap-group" id="cap-78">Then the Civil War came.</div>
                                                <div class="cap-group" id="cap-79">He served briefly.</div>
                                                <div class="cap-group" id="cap-80">Came home.</div>
                                                <div class="cap-group" id="cap-81">And married a woman named</div>
                                                <div class="cap-group" id="cap-82">Charlotte Rhodes.</div>
                                                <div class="cap-group" id="cap-83">Her father was Daniel Rhodes.</div>
                                                <div class="cap-group" id="cap-84">Coal and iron.</div>
                                                <div class="cap-group" id="cap-85">One of the men quietly</div>
                                                <div class="cap-group" id="cap-86">getting rich off everything Cleveland</div>
                                                <div class="cap-group" id="cap-87">was becoming.</div>
                                                <div class="cap-group" id="cap-88">Hanna walked into that business,</div>
                                                <div class="cap-group" id="cap-89">and never walked out.</div>
                                                <div class="cap-group" id="cap-90">By eighteen sixty-seven, Marcus Alonzo</div>
                                                <div class="cap-group" id="cap-91">Hanna had built MA Hanna</div>
                                                <div class="cap-group" id="cap-92">and Company.</div>
                                                <div class="cap-group" id="cap-93">A coal and iron brokerage,</div>
                                                <div class="cap-group" id="cap-94">sitting at the exact pivot</div>
                                                <div class="cap-group" id="cap-95">point where Lake Erie ore</div>
                                                <div class="cap-group" id="cap-96">boats unloaded for the Pittsburgh</div>
                                                <div class="cap-group" id="cap-97">steel mills.</div>
                                                <div class="cap-group" id="cap-98">Cleveland was the chokepoint.</div>
                                                <div class="cap-group" id="cap-99">And Hanna sat on it.</div>
                                                <div class="cap-group" id="cap-100">Every ton of iron ore</div>
                                                <div class="cap-group" id="cap-101">that crossed Lake Erie in</div>
                                                <div class="cap-group" id="cap-102">the eighteen seventies, passed through</div>
                                                <div class="cap-group" id="cap-103">brokers like him, he took</div>
                                                <div class="cap-group" id="cap-104">a cut.</div>
                                                <div class="cap-group" id="cap-105">Then he bought the newspaper,</div>
                                                <div class="cap-group" id="cap-106">the Cleveland Herald.</div>
                                                <div class="cap-group" id="cap-107">Then a theater.</div>
                                                <div class="cap-group" id="cap-108">Then banking interests.</div>
                                                <div class="cap-group" id="cap-109">Then a streetcar line.</div>
                                                <div class="cap-group" id="cap-110">By eighteen eighty, he controlled</div>
                                                <div class="cap-group" id="cap-111">enough of Cleveland that when</div>
                                                <div class="cap-group" id="cap-112">he walked into a room,</div>
                                                <div class="cap-group" id="cap-113">the room changed temperature.</div>
                                                <div class="cap-group" id="cap-114">And he was bored.</div>
                                                <div class="cap-group" id="cap-115">Not with money, he had</div>
                                                <div class="cap-group" id="cap-116">money.</div>
                                                <div class="cap-group" id="cap-117">Bored with the ceiling.</div>
                                                <div class="cap-group" id="cap-118">Because Hanna had figured out,</div>
                                                <div class="cap-group" id="cap-119">watching the men who supplied</div>
                                                <div class="cap-group" id="cap-120">his coal, the politicians who</div>
                                                <div class="cap-group" id="cap-121">regulated his railroads, the judges</div>
                                                <div class="cap-group" id="cap-122">who settled his contracts, that</div>
                                                <div class="cap-group" id="cap-123">money was the second most</div>
                                                <div class="cap-group" id="cap-124">powerful thing in America.</div>
                                                <div class="cap-group" id="cap-125">The most powerful thing, was</div>
                                                <div class="cap-group" id="cap-126">who decided where the money</div>
                                                <div class="cap-group" id="cap-127">went.</div>
                                                <div class="cap-group" id="cap-128">That was politics.</div>
                                                <div class="cap-group" id="cap-129">And no one had ever</div>
                                                <div class="cap-group" id="cap-130">run it like a business.</div>
                                                <div class="cap-group" id="cap-131">Not yet.</div>
                                                <div class="cap-group" id="cap-132">The year was eighteen eighty-eight.</div>
                                                <div class="cap-group" id="cap-133">The Republican National Convention.</div>
                                                <div class="cap-group" id="cap-134">Chicago.</div>
                                                <div class="cap-group" id="cap-135">Mark Hanna arrived not as</div>
                                                <div class="cap-group" id="cap-136">a candidate, but as a</div>
                                                <div class="cap-group" id="cap-137">kingmaker.</div>
                                                <div class="cap-group" id="cap-138">His man was John Sherman.</div>
                                                <div class="cap-group" id="cap-139">Ohio senator.</div>
                                                <div class="cap-group" id="cap-140">Treasury veteran.</div>
                                                <div class="cap-group" id="cap-141">The establishment choice.</div>
                                                <div class="cap-group" id="cap-142">Hanna worked the convention floor</div>
                                                <div class="cap-group" id="cap-143">for six days.</div>
                                                <div class="cap-group" id="cap-144">Trading delegates.</div>
                                                <div class="cap-group" id="cap-145">Promising postmasterships.</div>
                                                <div class="cap-group" id="cap-146">Calling in markers from Ohio</div>
                                                <div class="cap-group" id="cap-147">to Pennsylvania.</div>
                                                <div class="cap-group" id="cap-148">Sherman peaked on the first</div>
                                                <div class="cap-group" id="cap-149">ballot at two hundred and</div>
                                                <div class="cap-group" id="cap-150">twenty-nine votes.</div>
                                                <div class="cap-group" id="cap-151">Then he bled out.</div>
                                                <div class="cap-group" id="cap-152">Ballot after ballot, until the</div>
                                                <div class="cap-group" id="cap-153">nomination went to Benjamin Harrison</div>
                                                <div class="cap-group" id="cap-154">on the eighth.</div>
                                                <div class="cap-group" id="cap-155">Hanna lost.</div>
                                                <div class="cap-group" id="cap-156">But he saw something that</div>
                                                <div class="cap-group" id="cap-157">week he would never forget.</div>
                                                <div class="cap-group" id="cap-158">A forty-five year old congressman</div>
                                                <div class="cap-group" id="cap-159">from Canton, Ohio had been</div>
                                                <div class="cap-group" id="cap-160">chairing the resolutions committee.</div>
                                                <div class="cap-group" id="cap-161">When delegates began breaking toward</div>
                                                <div class="cap-group" id="cap-162">him as a dark-horse alternative,</div>
                                                <div class="cap-group" id="cap-163">the congressman walked to the</div>
                                                <div class="cap-group" id="cap-164">microphone, and refused.</div>
                                                <div class="cap-group" id="cap-165">He told the convention he</div>
                                                <div class="cap-group" id="cap-166">was bound to Sherman.</div>
                                                <div class="cap-group" id="cap-167">And he sat down.</div>
                                                <div class="cap-group" id="cap-168">That kind of loyalty was</div>
                                                <div class="cap-group" id="cap-169">rare in eighteen eighty-eight politics.</div>
                                                <div class="cap-group" id="cap-170">It was almost extinct.</div>
                                                <div class="cap-group" id="cap-171">His name was William McKinley.</div>
                                                <div class="cap-group" id="cap-172">Hanna walked across the floor,</div>
                                                <div class="cap-group" id="cap-173">and introduced himself.</div>
                                                <div class="cap-group" id="cap-174">He didn't know it yet.</div>
                                                <div class="cap-group" id="cap-175">But he had just found</div>
                                                <div class="cap-group" id="cap-176">his president.</div>
    </div>
