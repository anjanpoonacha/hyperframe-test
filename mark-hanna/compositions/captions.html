                                                                                                                                                                                                <div class="cap-group" id="cap-1231">Rockefeller's, the man who paid</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1232">Hannah's first assessment in 1896,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1233">averages 151,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1234">Hannah gets 1 50th of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1235">Roosevelt's traffic.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1236">He gets 1 25th of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1237">Rockefeller's.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1238">Other names from the 1896</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1239">campaign are 50 times more</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1240">interesting to the present day</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1241">reader than the man who</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1242">built the campaign.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1243">Americans search for what Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1244">built.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1245">They do not search for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1246">him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1247">The erasure that started with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1248">Roosevelt's reforms and continued through</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1249">the textbook revisions of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1250">interwar decades is still active.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1251">It is still working.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1252">The reason you have never</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1253">heard his name is that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1254">for 120 years, the people</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1255">who knew it had reasons</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1256">not to say it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1257">In 1896, the cartoon was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1258">a joke.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1259">Mark Hannah in a suit</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1260">covered in dollar signs, smoking</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1261">a cigar the size of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1262">a forearm every week, every</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1263">Hearst paper, the same man.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1264">The joke was that anyone</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1265">could see what Hannah was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1266">doing.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1267">The joke was right.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1268">He raised the money.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1269">He elected the president.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1270">He invented modern campaign finance.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1271">The system the cartoon was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1272">mocking became the way American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1273">elections work.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1274">The cartoon stopped running.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1275">The system did not.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1276">This is the man nobody</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1277">remembers.</div>
    </div>
