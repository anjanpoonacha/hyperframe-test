                                                                                                                                                                                                <div class="cap-group" id="cap-925">Hannah had spent 40 years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-926">keeping it off.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-927">The two men shared a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-928">party, a cabinet, and almost</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-929">nothing else.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-930">In the autumn of 1903,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-931">with the 1904 nomination a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-932">year away, Hannah began quietly</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-933">weighing whether to challenge Roosevelt</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-934">for the Republican nomination.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-935">He never said so publicly.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-936">He never built an organization.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-937">He told confidence he was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-938">thinking about it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-939">He let the corporate donors</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-940">who had funded McKinley know</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-941">he was available.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-942">He did not announce.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-943">Roosevelt and his ally Joseph</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-944">Fouracre, two-term Ohio governor, senator</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-945">since 1897, the man Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-946">had blocked from a cabinet</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-947">seat knew.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-948">They set a trap.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-949">The Ohio Republican State Convention</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-950">met in Columbus in October,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-951">1903.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-952">A resolution was introduced from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-953">the floor endorsing President Roosevelt's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-954">renomination in 1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-955">Resolution was a year early.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-956">State conventions did not normally</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-957">endorse presidential nominees until the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-958">spring of an election year.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-959">The timing was deliberate.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-960">It was meant to force</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-961">Hannah's hand.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-962">Hannah did what any operator</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-963">of his experience would do.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-964">He went to Roosevelt directly.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-965">He told the president he</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-966">might oppose the resolution as</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-967">premature.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-968">He framed it as a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-969">procedural objection, not a political</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-970">one.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-971">He gave Roosevelt the chance</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-972">to back off, Roosevelt's reply.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-973">By letter was one of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-974">the most elegant political knives</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-975">in American history.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-976">He was not requesting Hannah's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-977">support, he wrote.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-978">He was not requesting anyone's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-979">support, but he was confident</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-980">that all loyal supporters of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-981">his administration would naturally vote</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-982">for the resolution.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-983">The decision, of course, was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-984">Hannah's.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-985">Voting against the resolution would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-986">have been a public answer</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-987">to the question.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-988">Hannah voted yes.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-989">He had no choice.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-990">The Ohio Convention passed the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-991">endorsement unanimously.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-992">The 1904 nomination was settled.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-993">Hannah's challenge ended before it</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-994">began.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-995">He had been outplayed by</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-996">a man he had publicly</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-997">called a madman, outplayed without</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-998">a single dollar being raised,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-999">a single delegate being courted,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1000">or a single overt threat</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1001">being made.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1002">Four months later, he was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1003">dead.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1004">In early February, 1904, Mark</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1005">Hannah fell ill at the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1006">Arlington Hotel in Washington, D.C.,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1007">two blocks from the White</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1008">House, the city's most fashionable</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1009">address, the place where senators</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1010">stayed when they did not</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1011">keep a Washington home.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1012">He was running a fever.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1013">The Senate was in session.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1014">He was working from his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1015">hotel room.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1016">The diagnosis came back, typhoid</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1017">fever, a disease of contaminated</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1018">water and poor sanitation, common</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1019">in the city's poorer neighborhoods,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1020">less common in its hotels.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1021">The Theodore Roosevelt Center holds</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1022">the medical bulletin.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1023">It is dated February 12th,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1024">1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1025">The bulletin reports active illness.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1026">By February 14th, he could</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1027">not sit up.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1028">Hannah died at 640 in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1029">the evening on February 15th,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1030">1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1031">He was 66 years old.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1032">He had served in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1033">United States Senate for six</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1034">years and 11 months.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1035">He had chaired the Republican</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1036">National Committee for eight.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1037">He had run a Cleveland</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1038">business for 40.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1039">His body was returned to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1040">Cleveland by funeral train.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1041">He was buried at Lakeview</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1042">Cemetery on the same hilltop</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1043">where he had helped arrange</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1044">the burial of James Garfield</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1045">23 years earlier.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1046">20,000 people attended.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1047">Roosevelt did not come.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1048">He sent his cabinet.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1049">Four days after the funeral</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1050">on February 19th, 1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1051">Theodore Roosevelt wrote a letter</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1052">to his son Ted at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1053">Groton.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1054">Poor Hannah's death was a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1055">tragedy.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1056">At the end, he wrote</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1057">me a note, the last</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1058">he ever wrote, which showed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1059">him at his best and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1060">which I much appreciate.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1061">His death was very sad</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1062">for his family and close</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1063">friends for he had many</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1064">large and generous traits and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1065">had made a great success</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1066">in life by his energy,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1067">perseverance and burly strength.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1068">Roosevelt could afford to be</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1069">generous.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1070">He had won.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1071">On January 26th, 1907, Theodore</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1072">Roosevelt signed the Tillman Act</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1073">into law.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1074">The bill had been introduced</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1075">by Senator Benjamin Tillman of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1076">South Carolina, a former governor</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1077">and outspoken white supremacist demagogue</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1078">and one of the few</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1079">sitting senators willing to publicly</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1080">attack Wall Street.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1081">He was a Roosevelt ally</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1082">on this bill alone.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1083">It made it a federal</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1084">crime for any national bank</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1085">or any corporation organized under</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1086">federal law to contribute money</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1087">to any political campaign.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1088">The exact mechanism Hannah had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1089">pioneered in 1896, the assessment</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1090">letter to corporate treasurers demanding</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1091">payment proportional to capital became</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1092">a federal felony 11 years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1093">after he invented it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1094">Standard oil could not legally</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1095">pay another assessment.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1096">Carnegie Steel could not.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1097">The railroads could not.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1098">The insurance companies could not.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1099">The system that had elected</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1100">McKinley twice was now a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1101">crime.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1102">Roosevelt did not name Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1103">in the signing statement.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1104">He did not need to.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1105">Every newspaper in the country</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1106">understood what the bill outlawed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1107">The Tillman Act became the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1108">most consequential campaign finance reform</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1109">in American history until the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1110">Federal Election Campaign Act of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1111">1971.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1112">It stayed on the books</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1113">in some form for 103</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1114">years.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1115">On January 21st, 2010, the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1116">Supreme Court of the United</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1117">States decided Citizens United v.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1118">Federal Election Commission by a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1119">vote of five to four.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1120">The opinion held that corporate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1121">political expenditures when made independently</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1122">of a candidate's campaign are</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1123">protected speech under the First</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1124">Amendment.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1125">The Tillman Act's federal ban</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1126">on corporate political spending was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1127">effectively gutted.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1128">The wall Roosevelt had built</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1129">around Hannah's system in 1907</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1130">came down in 2010.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1131">Within five years of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1132">Citizens United decision, independent corporate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1133">political spending exceeded $1 billion</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1134">per election cycle.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1135">By 2024, corporate-funded super-PACs had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1136">raised more than $4 billion</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1137">in a single election.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1138">Hannah's system was back in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1139">a different legal form, but</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1140">back.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1141">The court did not cite</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1142">Mark Hannah.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1143">The plaintiffs did not invoke</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1144">him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1145">The dissents did not name</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1146">him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1147">Hannah had been dead for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1148">106 years, and the system</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1149">he built was being relligalized</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1150">in a courtroom four blocks</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1151">from the Senate floor where</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1152">he had served his only</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1153">term.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1154">The country had forgotten the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1155">man whose machinery it was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1156">rebuilding.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1157">Mark Hannah died in 1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1158">The Davenport image, Hannah in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1159">the dollar sign suit, cigar</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1160">the size of a forearm,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1161">kept circulating for years through</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1162">reprints, Brian campaign materials, and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1163">the 1898 collected edition Davenport</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1164">published before moving from the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1165">journal to the rival evening</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1166">mail.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1167">By the early 1920s, it</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1168">was gone.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1169">Three things erased him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1170">They did it slowly.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1171">They did it without anyone</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1172">noticing.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1173">The first was Roosevelt's Tillman</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1174">Act.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1175">After January, 1907, Hannah's methods</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1176">were a federal crime.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1177">No Republican party leader could</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1178">celebrate the man who invented</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1179">the practice the party's own</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1180">president had just outlawed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1181">Hannah's name became politically toxic</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1182">to the people who had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1183">benefited most from his work.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1184">The party that owed him</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1185">everything had every reason to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1186">stop mentioning him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1187">So it stopped.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1188">The second was the textbook</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1189">revisions across the interwar decades.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1190">American high schools standardized their</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1191">history curricula in the years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1192">after the First World War.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1193">The Gilded Age chapter tightened.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1194">The progressive era expanded.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1195">The story became Roosevelt versus</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1196">the trusts, Wilson versus the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1197">banks, the muckrakers versus the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1198">bosses.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1199">Hannah did not fit.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1200">He was not a clean</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1201">villain.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1202">McKinley's family liked him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1203">The press corps respected him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1204">His Senate colleagues mourned him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1205">In his last years, he</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1206">co-founded the National Civic Federation.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1207">An experiment in putting corporate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1208">executives and union leaders at</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1209">the same table.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1210">He was the only Gilded</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1211">Age industrialist who would publicly</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1212">share a stage with the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1213">head of the largest American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1214">union of the era.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1215">And he was not a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1216">hero either.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1217">He was the mechanism.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1218">By the 1930s, the new</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1219">textbooks had dropped him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1220">A generation of American students</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1221">learned the 1896 campaign without</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1222">learning the name of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1223">man who ran it.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1224">The third is the one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1225">you can measure in 2026.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1226">Hannah's Wikipedia article averages around</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1227">6,000 views a month.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1228">McKinley's averages 145,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1229">Theodore Roosevelt's averages 324,000.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-1230">John D.</div>
