                                                                                                <div class="cap-group" id="cap-270">ever tried at scale.</div>
                                                                                                <div class="cap-group" id="cap-271">The mechanism was simple and</div>
                                                                                                <div class="cap-group" id="cap-272">entirely unprecedented in American politics.</div>
                                                                                                <div class="cap-group" id="cap-273">By July, 1896, Hannah had</div>
                                                                                                <div class="cap-group" id="cap-274">decided that banks and corporations</div>
                                                                                                <div class="cap-group" id="cap-275">would be assessed for the</div>
                                                                                                <div class="cap-group" id="cap-276">campaign in proportion to their</div>
                                                                                                <div class="cap-group" id="cap-277">capital.</div>
                                                                                                <div class="cap-group" id="cap-278">He settled on one quarter</div>
                                                                                                <div class="cap-group" id="cap-279">of 1%, a bank with</div>
                                                                                                <div class="cap-group" id="cap-280">$20 million in capital owed</div>
                                                                                                <div class="cap-group" id="cap-281">50,000, a railroad with 200</div>
                                                                                                <div class="cap-group" id="cap-282">million owed 500,000, small enough</div>
                                                                                                <div class="cap-group" id="cap-283">to feel like a tax,</div>
                                                                                                <div class="cap-group" id="cap-284">large enough to fund a</div>
                                                                                                <div class="cap-group" id="cap-285">continent.</div>
                                                                                                <div class="cap-group" id="cap-286">He did not call it</div>
                                                                                                <div class="cap-group" id="cap-287">a request.</div>
                                                                                                <div class="cap-group" id="cap-288">By every contemporary account, Hannah's</div>
                                                                                                <div class="cap-group" id="cap-289">approach was not a request.</div>
                                                                                                <div class="cap-group" id="cap-290">It was an assessment.</div>
                                                                                                <div class="cap-group" id="cap-291">The letter from Republican headquarters</div>
                                                                                                <div class="cap-group" id="cap-292">did not ask whether the</div>
                                                                                                <div class="cap-group" id="cap-293">firm wished to support the</div>
                                                                                                <div class="cap-group" id="cap-294">campaign.</div>
                                                                                                <div class="cap-group" id="cap-295">It told the firm what</div>
                                                                                                <div class="cap-group" id="cap-296">its share was.</div>
                                                                                                <div class="cap-group" id="cap-297">It named a date.</div>
                                                                                                <div class="cap-group" id="cap-298">It named an amount.</div>
                                                                                                <div class="cap-group" id="cap-299">It included payment instructions.</div>
                                                                                                <div class="cap-group" id="cap-300">Standard oil paid first.</div>
                                                                                                <div class="cap-group" id="cap-301">John D.</div>
                                                                                                <div class="cap-group" id="cap-302">Rockefeller paid first.</div>
                                                                                                <div class="cap-group" id="cap-303">Hannah's high school classmate at</div>
                                                                                                <div class="cap-group" id="cap-304">Cleveland Central 43 years earlier.</div>
                                                                                                <div class="cap-group" id="cap-305">Now in control of nine</div>
                                                                                                <div class="cap-group" id="cap-306">of every 10 gallons of</div>
                                                                                                <div class="cap-group" id="cap-307">refined American oil.</div>
                                                                                                <div class="cap-group" id="cap-308">He contributed $250,000, the equivalent</div>

                                                                                                <div class="cap-group" id="cap-310">money, the largest single political</div>

                                                                                                <div class="cap-group" id="cap-313">It came without a public</div>

                                                                                                <div class="cap-group" id="cap-316">Rockefeller paid.</div>
                                                                                                <div class="cap-group" id="cap-317">Hannah recorded the receipt.</div>
                                                                                                <div class="cap-group" id="cap-318">Both men understood what had</div>

                                                                                                <div class="cap-group" id="cap-320">Carnegie Steel paid second.</div>
                                                                                                <div class="cap-group" id="cap-321">Other steel firms followed.</div>
                                                                                                <div class="cap-group" id="cap-322">Then the railroads, the Pennsylvania,</div>

                                                                                                <div class="cap-group" id="cap-325">Then the insurance houses, New</div>

                                                                                                <div class="cap-group" id="cap-327">Then the banks.</div>
                                                                                                <div class="cap-group" id="cap-328">By August, every major financial</div>
                                                                                                <div class="cap-group" id="cap-329">institution in the Northeast had</div>
                                                                                                <div class="cap-group" id="cap-330">paid its assessment.</div>
                                                                                                <div class="cap-group" id="cap-331">The total raised was at</div>
                                                                                                <div class="cap-group" id="cap-332">least three and a half</div>

                                                                                                <div class="cap-group" id="cap-334">Some estimates run to 10</div>
                                                                                                <div class="cap-group" id="cap-335">million.</div>
                                                                                                <div class="cap-group" id="cap-336">Either figure dwarfed every previous</div>
                                                                                                <div class="cap-group" id="cap-337">American campaign.</div>
                                                                                                <div class="cap-group" id="cap-338">William Jennings Bryan, the Democratic</div>
                                                                                                <div class="cap-group" id="cap-339">nominee, raised somewhere between 300,000</div>
                                                                                                <div class="cap-group" id="cap-340">and $675,000 in the same</div>
                                                                                                <div class="cap-group" id="cap-341">period.</div>
                                                                                                <div class="cap-group" id="cap-342">Hannah outspent him 20 to</div>

                                                                                                <div class="cap-group" id="cap-344">The money was not collected</div>

                                                                                                <div class="cap-group" id="cap-346">Every dollar went into the</div>
                                                                                                <div class="cap-group" id="cap-347">campaign.</div>
                                                                                                <div class="cap-group" id="cap-348">Pamphlets, posters, train tickets, hotel</div>
                                                                                                <div class="cap-group" id="cap-349">bills, telegrams, surrogate speakers, mailings,</div>

                                                                                                <div class="cap-group" id="cap-351">Hannah ran a public information</div>

                                                                                                <div class="cap-group" id="cap-353">The point was scale.</div>
                                                                                                <div class="cap-group" id="cap-354">What Hannah had built was</div>
                                                                                                <div class="cap-group" id="cap-355">a financial machine.</div>
                                                                                                <div class="cap-group" id="cap-356">A system that connected the</div>
                                                                                                <div class="cap-group" id="cap-357">largest corporations in the country</div>

                                                                                                <div class="cap-group" id="cap-362">It was a tax.</div>

                                                                                                <div class="cap-group" id="cap-370">on which day.</div>
                                                                                                <div class="cap-group" id="cap-371">And they paid because the</div>
                                                                                                <div class="cap-group" id="cap-372">alternative was Bryan winning.</div>
                                                                                                <div class="cap-group" id="cap-373">Bryan wanted to coin silver</div>
                                                                                                <div class="cap-group" id="cap-374">alongside gold.</div>
                                                                                                <div class="cap-group" id="cap-375">The bankers ran the numbers.</div>
                                                                                                <div class="cap-group" id="cap-376">Under his plan, every dollar</div>
                                                                                                <div class="cap-group" id="cap-377">in every American bank would</div>
                                                                                                <div class="cap-group" id="cap-378">buy half as much by</div>
                                                                                                <div class="cap-group" id="cap-379">inauguration day.</div>
                                                                                                <div class="cap-group" id="cap-380">Every loan they had made</div>
                                                                                                <div class="cap-group" id="cap-381">would come back in cheaper</div>

                                                                                                <div class="cap-group" id="cap-383">The men who held the</div>

                                                                                                <div class="cap-group" id="cap-385">men who absorbed the country's</div>
                                                                                                <div class="cap-group" id="cap-386">losses.</div>
                                                                                                <div class="cap-group" id="cap-387">For the people Hannah was</div>

                                                                                                <div class="cap-group" id="cap-390">It was the end of</div>
                                                                                                <div class="cap-group" id="cap-391">their world.</div>
                                                                                                <div class="cap-group" id="cap-392">After 1896, every major American</div>
                                                                                                <div class="cap-group" id="cap-393">political party copied the assessment</div>
                                                                                                <div class="cap-group" id="cap-394">system.</div>
                                                                                                <div class="cap-group" id="cap-395">The names changed.</div>
                                                                                                <div class="cap-group" id="cap-396">The mechanism did not, but</div>
                                                                                                <div class="cap-group" id="cap-397">raising the money was the</div>
                                                                                                <div class="cap-group" id="cap-398">easy part.</div>
                                                                                                <div class="cap-group" id="cap-399">Hannah had four months to</div>
                                                                                                <div class="cap-group" id="cap-400">spend it.</div>
                                                                                                <div class="cap-group" id="cap-401">Hannah called the campaign an</div>
                                                                                                <div class="cap-group" id="cap-402">education.</div>
                                                                                                <div class="cap-group" id="cap-403">Educating 76 million Americans in</div>
                                                                                                <div class="cap-group" id="cap-404">four months means industrial scale.</div>
                                                                                                <div class="cap-group" id="cap-405">The Republican National Committee printed</div>
                                                                                                <div class="cap-group" id="cap-406">200 million pamphlets in the</div>
                                                                                                <div class="cap-group" id="cap-407">four months between June and</div>

                                                                                                <div class="cap-group" id="cap-409">200 million.</div>
                                                                                                <div class="cap-group" id="cap-410">The American population in 1896</div>
                                                                                                <div class="cap-group" id="cap-411">was 76 million.</div>
                                                                                                <div class="cap-group" id="cap-412">Hannah mailed every adult voter</div>

                                                                                                <div class="cap-group" id="cap-415">The literature was multilingual.</div>

                                                                                                <div class="cap-group" id="cap-427">The English language pamphlets came</div>

                                                                                                <div class="cap-group" id="cap-429">One for railway workers.</div>
                                                                                                <div class="cap-group" id="cap-430">One for factory hands.</div>
                                                                                                <div class="cap-group" id="cap-431">One for shopkeepers.</div>
                                                                                                <div class="cap-group" id="cap-432">One for farmers in silver</div>
                                                                                                <div class="cap-group" id="cap-433">mining states.</div>
                                                                                                <div class="cap-group" id="cap-434">And a different one for</div>

                                                                                                <div class="cap-group" id="cap-436">The campaign tracked which version</div>

                                                                                                <div class="cap-group" id="cap-438">Hannah deployed 1400 surrogate speakers.</div>
                                                                                                <div class="cap-group" id="cap-439">He paid their travel.</div>
                                                                                                <div class="cap-group" id="cap-440">He coordinated their schedules.</div>
                                                                                                <div class="cap-group" id="cap-441">He kept them on message.</div>
                                                                                                <div class="cap-group" id="cap-442">Every county in every battleground</div>

                                                                                                <div class="cap-group" id="cap-444">in person before the November</div>
                                                                                                <div class="cap-group" id="cap-445">vote.</div>
                                                                                                <div class="cap-group" id="cap-446">The candidate stayed home.</div>
                                                                                                <div class="cap-group" id="cap-447">McKinley refused to travel.</div>
                                                                                                <div class="cap-group" id="cap-448">He believed a presidential nominee</div>

                                                                                                <div class="cap-group" id="cap-451">He told Hannah he would</div>

                                                                                                <div class="cap-group" id="cap-455">The Pennsylvania railroad, the Baltimore</div>
                                                                                                <div class="cap-group" id="cap-456">and Ohio, and a dozen</div>
                                                                                                <div class="cap-group" id="cap-457">other lines offered special excursion</div>
                                                                                                <div class="cap-group" id="cap-458">fares to Canton, Ohio.</div>
                                                                                                <div class="cap-group" id="cap-459">Population 30,000, roughly 300 miles</div>
                                                                                                <div class="cap-group" id="cap-460">from Washington, McKinley's hometown since</div>
                                                                                                <div class="cap-group" id="cap-461">the Civil War.</div>
                                                                                                <div class="cap-group" id="cap-462">Voters arrived from as far</div>
                                                                                                <div class="cap-group" id="cap-463">as Maine and Nebraska.</div>
                                                                                                <div class="cap-group" id="cap-464">They walked from the train</div>
                                                                                                <div class="cap-group" id="cap-465">station to the candidate's front</div>
                                                                                                <div class="cap-group" id="cap-466">porch.</div>
                                                                                                <div class="cap-group" id="cap-467">McKinley spoke from his lawn.</div>
                                                                                                <div class="cap-group" id="cap-468">He shook every hand.</div>
                                                                                                <div class="cap-group" id="cap-469">By election day, three quarters</div>
                                                                                                <div class="cap-group" id="cap-470">of a million Americans had</div>
                                                                                                <div class="cap-group" id="cap-471">stood in McKinley's front yard.</div>
                                                                                                <div class="cap-group" id="cap-472">Brian, meanwhile, traveled.</div>
                                                                                                <div class="cap-group" id="cap-473">The cross of gold speech</div>

                                                                                                <div class="cap-group" id="cap-479">The speech demanded the free</div>
                                                                                                <div class="cap-group" id="cap-480">coinage of silver to break</div>
                                                                                                <div class="cap-group" id="cap-481">what Brian called the grip</div>
                                                                                                <div class="cap-group" id="cap-482">of eastern banks on Western</div>
                                                                                                <div class="cap-group" id="cap-483">farmers.</div>
                                                                                                <div class="cap-group" id="cap-484">He closed it on a</div>
                                                                                                <div class="cap-group" id="cap-485">thesis.</div>
                                                                                                <div class="cap-group" id="cap-486">You shall not crucify mankind</div>
                                                                                                <div class="cap-group" id="cap-487">upon a cross of gold.</div>
                                                                                                <div class="cap-group" id="cap-488">The convention floor went silent</div>
                                                                                                <div class="cap-group" id="cap-489">for five seconds, then erupted.</div>
                                                                                                <div class="cap-group" id="cap-490">He spent the next four</div>
                                                                                                <div class="cap-group" id="cap-491">months on trains.</div>
                                                                                                <div class="cap-group" id="cap-492">He gave 600 speeches in</div>
                                                                                                <div class="cap-group" id="cap-493">27 states.</div>
                                                                                                <div class="cap-group" id="cap-494">He was magnificent in person.</div>
                                                                                                <div class="cap-group" id="cap-495">He was 36 years old</div>
                                                                                                <div class="cap-group" id="cap-496">and could fill a stadium</div>
                                                                                                <div class="cap-group" id="cap-497">with his voice alone.</div>
                                                                                                <div class="cap-group" id="cap-498">Hannah's response was tonnage, not</div>
                                                                                                <div class="cap-group" id="cap-499">eloquence.</div>
                                                                                                <div class="cap-group" id="cap-500">While Brian thundered to crowds</div>
                                                                                                <div class="cap-group" id="cap-501">of 10,000 at a time,</div>
                                                                                                <div class="cap-group" id="cap-502">Hannah delivered 200 million pieces</div>
                                                                                                <div class="cap-group" id="cap-503">of mail.</div>

                                                                                                <div class="cap-group" id="cap-509">The contest was not between</div>

                                                                                                <div class="cap-group" id="cap-511">It was between a man</div>
                                                                                                <div class="cap-group" id="cap-512">and a machine.</div>
                                                                                                <div class="cap-group" id="cap-513">On November 3rd, the country</div>
                                                                                                <div class="cap-group" id="cap-514">would tell them which it</div>
                                                                                                <div class="cap-group" id="cap-515">preferred.</div>
                                                                                                <div class="cap-group" id="cap-516">The polls closed in the</div>

                                                                                                <div class="cap-group" id="cap-518">evening on November 3rd, 1896.</div>
                                                                                                <div class="cap-group" id="cap-519">The first returns came in</div>
                                                                                                <div class="cap-group" id="cap-520">from Connecticut and New Hampshire.</div>
                                                                                                <div class="cap-group" id="cap-521">McKinley was running ahead of</div>
                                                                                                <div class="cap-group" id="cap-522">every Republican forecast.</div>
                                                                                                <div class="cap-group" id="cap-523">By midnight, the Northeast had</div>

                                                                                                <div class="cap-group" id="cap-530">McKinley took 271 electoral votes.</div>
                                                                                                <div class="cap-group" id="cap-531">Brian took 176.</div>

                                                                                                <div class="cap-group" id="cap-540">share of eligible voters in</div>

                                                                                                <div class="cap-group" id="cap-543">He took Illinois, Indiana, and</div>

                                                                                                <div class="cap-group" id="cap-548">He swept every Northeastern state.</div>
                                                                                                <div class="cap-group" id="cap-549">He swept the Midwestern industrial</div>
                                                                                                <div class="cap-group" id="cap-550">belt.</div>
                                                                                                <div class="cap-group" id="cap-551">Brian won the South, the</div>

                                                                                                <div class="cap-group" id="cap-554">McKinley sent Hannah a telegram</div>

                                                                                                <div class="cap-group" id="cap-556">The text was meant for</div>

                                                                                                <div class="cap-group" id="cap-1129">political expenditures when made independently</div>
                                                                                                <div class="cap-group" id="cap-1130">of a candidate's campaign are</div>
                                                                                                <div class="cap-group" id="cap-1131">protected speech under the First</div>
                                                                                                <div class="cap-group" id="cap-1132">Amendment.</div>
                                                                                                <div class="cap-group" id="cap-1133">The Tillman Act's federal ban</div>
                                                                                                <div class="cap-group" id="cap-1134">on corporate political spending was</div>
                                                                                                <div class="cap-group" id="cap-1135">effectively gutted.</div>
                                                                                                <div class="cap-group" id="cap-1136">The wall Roosevelt had built</div>
                                                                                                <div class="cap-group" id="cap-1137">around Hannah's system in 1907</div>
                                                                                                <div class="cap-group" id="cap-1138">came down in 2010.</div>
                                                                                                <div class="cap-group" id="cap-1139">Within five years of the</div>
                                                                                                <div class="cap-group" id="cap-1140">Citizens United decision, independent corporate</div>
                                                                                                <div class="cap-group" id="cap-1141">political spending exceeded $1 billion</div>
                                                                                                <div class="cap-group" id="cap-1142">per election cycle.</div>
                                                                                                <div class="cap-group" id="cap-1143">By 2024, corporate-funded super PACs</div>
                                                                                                <div class="cap-group" id="cap-1144">had raised more than $4</div>
                                                                                                <div class="cap-group" id="cap-1145">billion in a single election.</div>
                                                                                                <div class="cap-group" id="cap-1146">Hannah's system was back in</div>
                                                                                                <div class="cap-group" id="cap-1147">a different legal form, but</div>
                                                                                                <div class="cap-group" id="cap-1148">back.</div>
                                                                                                <div class="cap-group" id="cap-1149">The court did not cite</div>
                                                                                                <div class="cap-group" id="cap-1150">Mark Hannah.</div>
                                                                                                <div class="cap-group" id="cap-1151">The plaintiffs did not invoke</div>
                                                                                                <div class="cap-group" id="cap-1152">him.</div>
                                                                                                <div class="cap-group" id="cap-1153">The dissents did not name</div>
                                                                                                <div class="cap-group" id="cap-1154">him.</div>
                                                                                                <div class="cap-group" id="cap-1155">Hannah had been dead for</div>
                                                                                                <div class="cap-group" id="cap-1156">106 years, and the system</div>
                                                                                                <div class="cap-group" id="cap-1157">he built was being relegated</div>
                                                                                                <div class="cap-group" id="cap-1158">in a courtroom four blocks</div>
                                                                                                <div class="cap-group" id="cap-1159">from the Senate floor where</div>
                                                                                                <div class="cap-group" id="cap-1160">he had served his only</div>
                                                                                                <div class="cap-group" id="cap-1161">term.</div>
                                                                                                <div class="cap-group" id="cap-1162">The country had forgotten the</div>
                                                                                                <div class="cap-group" id="cap-1163">man whose machinery it was</div>
                                                                                                <div class="cap-group" id="cap-1164">rebuilding.</div>
                                                                                                <div class="cap-group" id="cap-1165">Mark Hannah died in 1904.</div>
                                                                                                <div class="cap-group" id="cap-1166">The Davenport image, Hannah in</div>
                                                                                                <div class="cap-group" id="cap-1167">the dollar sign suit, cigar</div>
                                                                                                <div class="cap-group" id="cap-1168">the size of a forearm,</div>
                                                                                                <div class="cap-group" id="cap-1169">kept circulating for years through</div>
                                                                                                <div class="cap-group" id="cap-1170">reprints, Brian campaign materials, and</div>
                                                                                                <div class="cap-group" id="cap-1171">the 1898 collected edition Davenport</div>
                                                                                                <div class="cap-group" id="cap-1172">published before moving from the</div>
                                                                                                <div class="cap-group" id="cap-1173">journal to the rival evening</div>
                                                                                                <div class="cap-group" id="cap-1174">mail.</div>
                                                                                                <div class="cap-group" id="cap-1175">By the early 1920s, it</div>
                                                                                                <div class="cap-group" id="cap-1176">was gone.</div>
                                                                                                <div class="cap-group" id="cap-1177">Three things erased him.</div>
                                                                                                <div class="cap-group" id="cap-1178">They did it slowly.</div>
                                                                                                <div class="cap-group" id="cap-1179">They did it without anyone</div>
                                                                                                <div class="cap-group" id="cap-1180">noticing.</div>
                                                                                                <div class="cap-group" id="cap-1181">The first was Roosevelt's Tillman</div>
                                                                                                <div class="cap-group" id="cap-1182">Act.</div>
                                                                                                <div class="cap-group" id="cap-1183">After January 1907, Hannah's methods</div>
                                                                                                <div class="cap-group" id="cap-1184">were a federal crime.</div>
                                                                                                <div class="cap-group" id="cap-1185">No Republican party leader could</div>
                                                                                                <div class="cap-group" id="cap-1186">celebrate the man who invented</div>
                                                                                                <div class="cap-group" id="cap-1187">the practice the party's own</div>
                                                                                                <div class="cap-group" id="cap-1188">president had just outlawed.</div>
                                                                                                <div class="cap-group" id="cap-1189">Hannah's name became politically toxic</div>
                                                                                                <div class="cap-group" id="cap-1190">to the people who had</div>
                                                                                                <div class="cap-group" id="cap-1191">benefited most from his work.</div>
                                                                                                <div class="cap-group" id="cap-1192">The party that owed him</div>
                                                                                                <div class="cap-group" id="cap-1193">everything had every reason to</div>
                                                                                                <div class="cap-group" id="cap-1194">stop mentioning him, so it</div>
                                                                                                <div class="cap-group" id="cap-1195">stopped.</div>
                                                                                                <div class="cap-group" id="cap-1196">The second was the textbook</div>
                                                                                                <div class="cap-group" id="cap-1197">revisions across the interwar decades.</div>
                                                                                                <div class="cap-group" id="cap-1198">American high schools standardized their</div>
                                                                                                <div class="cap-group" id="cap-1199">history curricula in the years</div>
                                                                                                <div class="cap-group" id="cap-1200">after the First World War.</div>
                                                                                                <div class="cap-group" id="cap-1201">The Gilded Age chapter tightened.</div>
                                                                                                <div class="cap-group" id="cap-1202">The Progressive Era expanded.</div>
                                                                                                <div class="cap-group" id="cap-1203">The story became Roosevelt versus</div>
                                                                                                <div class="cap-group" id="cap-1204">the trusts, Wilson versus the</div>
                                                                                                <div class="cap-group" id="cap-1205">banks, the muckrakers versus the</div>
                                                                                                <div class="cap-group" id="cap-1206">bosses.</div>
                                                                                                <div class="cap-group" id="cap-1207">Hannah did not fit.</div>
                                                                                                <div class="cap-group" id="cap-1208">He was not a clean</div>
                                                                                                <div class="cap-group" id="cap-1209">villain.</div>
                                                                                                <div class="cap-group" id="cap-1210">McKinley's family liked him.</div>
                                                                                                <div class="cap-group" id="cap-1211">The press corps respected him.</div>
                                                                                                <div class="cap-group" id="cap-1212">His Senate colleagues mourned him.</div>
                                                                                                <div class="cap-group" id="cap-1213">In his last years, he</div>
                                                                                                <div class="cap-group" id="cap-1214">co-founded the National Civic Federation,</div>
                                                                                                <div class="cap-group" id="cap-1215">an experiment in putting corporate</div>
                                                                                                <div class="cap-group" id="cap-1216">executives and union leaders at</div>
                                                                                                <div class="cap-group" id="cap-1217">the same table.</div>
                                                                                                <div class="cap-group" id="cap-1218">He was the only Gilded</div>
                                                                                                <div class="cap-group" id="cap-1219">Age industrialist who would publicly</div>
                                                                                                <div class="cap-group" id="cap-1220">share a stage with the</div>
                                                                                                <div class="cap-group" id="cap-1221">head of the largest American</div>
                                                                                                <div class="cap-group" id="cap-1222">union of the era, and</div>
                                                                                                <div class="cap-group" id="cap-1223">he was not a hero</div>
                                                                                                <div class="cap-group" id="cap-1224">either.</div>
                                                                                                <div class="cap-group" id="cap-1225">He was the mechanism.</div>
                                                                                                <div class="cap-group" id="cap-1226">By the 1930s, the new</div>
                                                                                                <div class="cap-group" id="cap-1227">textbooks had dropped him.</div>
                                                                                                <div class="cap-group" id="cap-1228">A generation of American students</div>
                                                                                                <div class="cap-group" id="cap-1229">learned the 1896 campaign without</div>
                                                                                                <div class="cap-group" id="cap-1230">learning the name of the</div>
                                                                                                <div class="cap-group" id="cap-1231">man who ran it.</div>
                                                                                                <div class="cap-group" id="cap-1232">The third is the one</div>
                                                                                                <div class="cap-group" id="cap-1233">you can measure in 2026.</div>
                                                                                                <div class="cap-group" id="cap-1234">Hannah's Wikipedia article averages around</div>
                                                                                                <div class="cap-group" id="cap-1235">6,000 views a month.</div>
                                                                                                <div class="cap-group" id="cap-1236">McKinley's averages 145,000.</div>
                                                                                                <div class="cap-group" id="cap-1237">Theodore Roosevelt's averages 324,000.</div>
                                                                                                <div class="cap-group" id="cap-1238">John D.</div>
                                                                                                <div class="cap-group" id="cap-1239">Rockefeller's, the man who paid</div>
                                                                                                <div class="cap-group" id="cap-1240">Hannah's first assessment in 1896,</div>
                                                                                                <div class="cap-group" id="cap-1241">averages 151,000.</div>
                                                                                                <div class="cap-group" id="cap-1242">Hannah gets 1 50th of</div>
                                                                                                <div class="cap-group" id="cap-1243">Roosevelt's traffic.</div>
                                                                                                <div class="cap-group" id="cap-1244">He gets 1 25th of</div>
                                                                                                <div class="cap-group" id="cap-1245">Rockefeller's.</div>
                                                                                                <div class="cap-group" id="cap-1246">Other names from the 1896</div>
                                                                                                <div class="cap-group" id="cap-1247">campaign are 50 times more</div>
                                                                                                <div class="cap-group" id="cap-1248">interesting to the present day</div>
                                                                                                <div class="cap-group" id="cap-1249">reader than the man who</div>
                                                                                                <div class="cap-group" id="cap-1250">built the campaign.</div>
                                                                                                <div class="cap-group" id="cap-1251">Americans search for what Hannah</div>
                                                                                                <div class="cap-group" id="cap-1252">built.</div>
                                                                                                <div class="cap-group" id="cap-1253">They do not search for</div>
                                                                                                <div class="cap-group" id="cap-1254">him.</div>
                                                                                                <div class="cap-group" id="cap-1255">The erasure that started with</div>
                                                                                                <div class="cap-group" id="cap-1256">Roosevelt's reforms and continued through</div>
                                                                                                <div class="cap-group" id="cap-1257">the textbook revisions of the</div>
                                                                                                <div class="cap-group" id="cap-1258">interwar decades is still active.</div>
                                                                                                <div class="cap-group" id="cap-1259">It is still working.</div>
                                                                                                <div class="cap-group" id="cap-1260">The reason you have never</div>
                                                                                                <div class="cap-group" id="cap-1261">heard his name is that</div>
                                                                                                <div class="cap-group" id="cap-1262">for 120 years, the people</div>
                                                                                                <div class="cap-group" id="cap-1263">who knew it had reasons</div>
                                                                                                <div class="cap-group" id="cap-1264">not to say it.</div>
                                                                                                <div class="cap-group" id="cap-1265">In 1896, the cartoon was</div>
                                                                                                <div class="cap-group" id="cap-1266">a joke.</div>
                                                                                                <div class="cap-group" id="cap-1267">Mark Hannah in a suit</div>
                                                                                                <div class="cap-group" id="cap-1268">covered in dollar signs, smoking</div>
                                                                                                <div class="cap-group" id="cap-1269">a cigar the size of</div>
                                                                                                <div class="cap-group" id="cap-1270">a forearm every week, every</div>
                                                                                                <div class="cap-group" id="cap-1271">hearse paper, the same man.</div>
                                                                                                <div class="cap-group" id="cap-1272">The joke was that anyone</div>
                                                                                                <div class="cap-group" id="cap-1273">could see what Hannah was</div>
                                                                                                <div class="cap-group" id="cap-1274">doing.</div>
                                                                                                <div class="cap-group" id="cap-1275">The joke was right.</div>
                                                                                                <div class="cap-group" id="cap-1276">He raised the money.</div>
                                                                                                <div class="cap-group" id="cap-1277">He elected the president.</div>
                                                                                                <div class="cap-group" id="cap-1278">He invented modern campaign finance.</div>
                                                                                                <div class="cap-group" id="cap-1279">The system the cartoon was</div>
                                                                                                <div class="cap-group" id="cap-1280">mocking became the way American</div>
                                                                                                <div class="cap-group" id="cap-1281">elections work.</div>
                                                                                                <div class="cap-group" id="cap-1282">The cartoon stopped running.</div>
                                                                                                <div class="cap-group" id="cap-1283">The system did not.</div>
                                                                                                <div class="cap-group" id="cap-1284">This is the man nobody</div>
                                                                                                <div class="cap-group" id="cap-1285">remembers.</div>
    </div>
