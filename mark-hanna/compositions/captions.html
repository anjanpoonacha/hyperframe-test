                                                                                                                                                                                                <div class="cap-group" id="cap-617">On the other side were</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-618">the words McKinley and Hobart,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-619">sound money and protection.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-620">A small gold eagle with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-621">outstretched wings was set above</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-622">the inscription.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-623">Each medal was struck individually.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-624">Hannah handed them around the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-625">table himself, calling each man</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-626">by name.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-627">The Vienna Progress, a small</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-628">Georgia weekly, ran the full</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-629">account a week later.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-630">When he rose to speak,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-631">Hannah did not toast McKinley.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-632">He toasted the press.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-633">When I began this campaign,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-634">he said, I felt that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-635">I should be safe if</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-636">I only had the friendship</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-637">of the newspaper men.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-638">I began to diagnose the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-639">situation.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-640">Now that the situation has</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-641">been brought to a successful</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-642">issue, I don't mind telling</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-643">you I picked up a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-644">great many pointers from you.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-645">I found that every one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-646">of you were just as</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-647">fully alive to the situation</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-648">as I was.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-649">They came to me fresh</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-650">from the people whom they</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-651">had seen.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-652">And I must say, I</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-653">got as much information from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-654">them as they did from</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-655">me.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-656">He was telling 31 reporters</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-657">four days after winning the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-658">presidency that he had used</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-659">them as an intelligence network.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-660">He had read their dispatches</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-661">every morning since June.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-662">He had tracked which states</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-663">were drifting and which were</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-664">holding.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-665">He had adjusted his pamphlet</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-666">runs and his surrogate routes</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-667">by what the press observed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-668">in the counties.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-669">The reporters were not propaganda</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-670">targets.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-671">They were sources.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-672">Polling did not yet exist.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-673">Focus groups did not yet</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-674">exist.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-675">The reporters were how he</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-676">saw the country.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-677">He sat down.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-678">Each reporter went home with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-679">a gold medal.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-680">By morning, the story was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-681">on every wire service in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-682">the country and Mark Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-683">had become the most powerful</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-684">unelected man in America.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-685">John Sherman resigned his seat</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-686">in the United States Senate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-687">in early 1897 to become</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-688">William McKinley's Secretary of State.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-689">The resignation cleared the most</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-690">coveted political position in Ohio</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-691">at exactly the moment Mark</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-692">Hannah needed one.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-693">On March 5th, 1897, Ohio's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-694">Republican governor, no friend of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-695">Hannah's in office because Hannah</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-696">had not opposed him, appointed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-697">Hannah to fill the seat.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-698">The appointment was widely understood</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-699">as a payoff.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-700">Hannah had spent 20 years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-701">putting McKinley in the White</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-702">House.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-703">The Senate seat was the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-704">receipt.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-705">In January 1898, the Ohio</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-706">General Assembly elected Hannah to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-707">a full six year term.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-708">The election was contested.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-709">An Ohio State Senator testified</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-710">under oath that Hannah's people</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-711">had offered him cash to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-712">flip his vote.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-713">The US Senate investigated and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-714">declined to sustain the charges.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-715">Hannah kept the seat.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-716">The story stayed in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-717">papers for two years.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-718">He served from March 5th,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-719">1897 to February 15th, 1904.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-720">He never lost an election</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-721">and never lost a vote.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-722">He chaired the Republican National</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-723">Committee through both McKinley campaigns</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-724">and into Roosevelt's first term.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-725">For six of those seven</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-726">years, he was the most</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-727">powerful unelected man in America.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-728">For the seventh, he was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-729">the second most powerful.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-730">Don't any of you realize</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-731">there's only one life between</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-732">this madman and the presidency?</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-733">Mark Hannah said it on</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-734">the convention floor in Philadelphia,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-735">June 21st, 1900.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-736">He said it loud enough</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-737">to be heard across the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-738">room.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-739">Reporters quoted it that afternoon.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-740">By the end of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-741">week, the line had reached</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-742">every major paper in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-743">country.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-744">The madman in question was</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-745">Theodore Roosevelt.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-746">The trouble had started in</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-747">1899.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-748">Vice President Garrett Hobart, Hannah's</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-749">closest ally inside the McKinley</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-750">administration, the man Hannah had</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-751">personally selected for the 1896</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-752">ticket, fell ill in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-753">autumn and died on November</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-754">21st, 1899.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-755">McKinley was seeking a second</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-756">term.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-757">The vice presidency was open.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-758">The New York Republican machine,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-759">run by Senator Thomas Platt,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-760">had been trying for two</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-761">years to dispose of the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-762">state's reform governor, a 41-year-old</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-763">reformer named Theodore Roosevelt.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-764">Rough rider in the Spanish-American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-765">war, former police commissioner of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-766">New York City, the loudest</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-767">voice for civil service, reform</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-768">in the Republican party.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-769">Roosevelt had spent his term</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-770">breaking up the corrupt patronage</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-771">system that kept Platt's organization</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-772">alive.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-773">Platt wanted him gone.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-774">The vice presidency was a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-775">gilded coffin.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-776">Platt began maneuvering to make</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-777">it Roosevelt's.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-778">Hannah was horrified.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-779">He had spent four years</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-780">building a relationship with McKinley</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-781">that defined American politics.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-782">The vice president was one</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-783">bullet from the presidency, and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-784">Hannah did not trust Roosevelt,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-785">not because Roosevelt was a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-786">bad man, but because Roosevelt</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-787">was a moralist.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-788">Hannah's politics were transactional.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-789">Roosevelt did not do deals.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-790">He picked fights and refused</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-791">to fund them.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-792">He would inherit the corporate</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-793">alliances that funded the party</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-794">and break them.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-795">The Republican National Convention opened</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-796">in Philadelphia on June 19th,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-797">1900.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-798">Roosevelt arrived as the Western</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-799">delegation's favorite.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-800">Platt had already pledged New</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-801">York.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-802">Pennsylvania followed.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-803">By the second day, Roosevelt</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-804">had momentum.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-805">The nomination was going to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-806">happen.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-807">Hannah stood on the Philadelphia</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-808">floor watching the votes accumulate.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-809">He had built the Republican</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-810">Party's machinery.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-811">He chaired its committee, and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-812">he could not stop the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-813">convention from nominating for vice</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-814">president of the United States,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-815">a man he believed would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-816">destroy everything the party stood</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-817">for.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-818">That was when he said</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-819">it, the line that would</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-820">follow him for the rest</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-821">of his life.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-822">The convention nominated Roosevelt for</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-823">vice president on June 21st,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-824">1900.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-825">McKinley accepted.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-826">Hannah campaigned for the ticket</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-827">anyway.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-828">McKinley and Roosevelt won the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-829">November election by a wider</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-830">margin than McKinley and Hobart</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-831">had won in 1896.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-832">Hannah was right.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-833">There was only one life</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-834">between Roosevelt and the presidency.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-835">It was William McKinley's.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-836">On September 6th, 1901, William</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-837">McKinley stood in a receiving</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-838">line at the Temple of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-839">Music at the Pan American</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-840">Exposition in Buffalo, New York.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-841">He was shaking hands with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-842">members of the public.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-843">The line had been moving</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-844">for 10 minutes when a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-845">28-year-old former steelworker named Leon</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-846">Czolgos approached the president with</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-847">a handkerchief wrapped around his</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-848">right hand.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-849">American-born son of Polish immigrants.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-850">Out of work since the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-851">1893 economic crash, radicalized the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-852">year before by the anarchist</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-853">lecture circuit, the handkerchief concealed</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-854">a 32-caliber Iver Johnson revolver.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-855">Czolgos fired twice.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-856">The first bullet glanced off</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-857">McKinley's coat button.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-858">The second entered his abdomen.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-859">The president was carried to</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-860">the home of a Buffalo</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-861">lawyer who had personally invited</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-862">McKinley to come on Delaware</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-863">Avenue.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-864">The doctors operated.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-865">They could not find the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-866">bullet.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-867">They closed the wound and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-868">waited.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-869">For a week, McKinley appeared</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-870">to be recovering.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-871">On September 13th, his condition</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-872">deteriorated.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-873">He died at two, 15</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-874">in the morning on September</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-875">14th, 1901.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-876">Vice President Roosevelt was hiking</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-877">on Mount Marcy in the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-878">Adirondacks when McKinley was shot.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-879">A guide located him.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-880">A buckboard and a special</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-881">train carried him to Buffalo.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-882">He took the oath of</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-883">office at the Wilcox House</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-884">on Delaware Avenue at 3.30</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-885">in the afternoon on September</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-886">14, hours after McKinley's death.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-887">Hannah was in Cleveland.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-888">When the news reached him</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-889">that McKinley had died and</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-890">Roosevelt had been sworn in,</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-891">he gave the response that</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-892">would follow him for the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-893">rest of his life.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-894">He said it to a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-895">friend in a private room</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-896">with no reporter present.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-897">The remark traveled through political</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-898">channels until it reached the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-899">public record.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-900">Now we've got that damned</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-901">cowboy as president.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-902">The line was Hannah's epitaph.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-903">It was also a forecast.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-904">Hannah was 64 years old</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-905">when McKinley died.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-906">He had two and a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-907">half years left, though no</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-908">one knew that yet.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-909">He spent them in a</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-910">slow motion confrontation with the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-911">man he had not been</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-912">able to stop in Philadelphia.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-913">Roosevelt and Hannah agreed on</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-914">almost nothing.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-915">Roosevelt wanted to break up</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-916">the trusts.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-917">Hannah had built his fortune</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-918">on them.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-919">Roosevelt wanted to regulate the</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-920">railroads.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-921">Hannah sat on the boards</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-922">of three of them.</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-923">Roosevelt wanted to give labor</div>
                                                                                                                                                                                                <div class="cap-group" id="cap-924">a seat at the table.</div>
