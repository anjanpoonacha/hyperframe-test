<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Mark Hanna · Section 01 Cold Open · Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body, html {
        margin: 0; padding: 0;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background-color: #0E0B08;
      }
      #stage {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
        background-color: #0E0B08;
      }
      .scene-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Period film-stock vignette */
      #vignette {
        position: absolute; inset: 0;
        pointer-events: none;
        z-index: 200;
        background: radial-gradient(
          ellipse at center,
          rgba(14, 11, 8, 0) 38%,
          rgba(14, 11, 8, 0.55) 88%,
          rgba(14, 11, 8, 0.85) 100%
        );
      }

      /* Animated grain */
      @keyframes grain-shift {
        0%, 100% { transform: translate(0, 0); }
        12% { transform: translate(-2%, -1%); }
        24% { transform: translate(1%, -2%); }
        36% { transform: translate(-1%, 1%); }
        48% { transform: translate(2%, 0); }
        60% { transform: translate(0, 2%); }
        72% { transform: translate(-2%, 1%); }
        84% { transform: translate(1%, -1%); }
      }
      #grain {
        position: absolute;
        top: -10%; left: -10%;
        width: 120%; height: 120%;
        pointer-events: none;
        z-index: 199;
        opacity: 0.10;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0.5px, transparent 1px),
          radial-gradient(circle at 70% 70%, rgba(255,255,255,0.3) 0.5px, transparent 1px),
          radial-gradient(circle at 40% 80%, rgba(255,255,255,0.25) 0.5px, transparent 1px);
        background-size: 3px 3px, 5px 5px, 4px 4px;
        animation: grain-shift 0.5s steps(8) infinite;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="mark-hanna-s01-preview" data-width="1920" data-height="1080" data-start="0" data-duration="99">

      <!-- Section 01: Cold Open (0–94.23s) -->
      <div id="scene-01" class="scene-layer clip" data-composition-id="scene-01-cold-open"
           data-composition-src="compositions/scene-01-cold-open.html"
           data-start="0" data-duration="94.23" data-track-index="1"></div>

      <!-- Section 02: Title card (94.5–99s, 4.5s flash, visual-only) -->
      <div id="scene-02" class="scene-layer clip" data-composition-id="scene-02-title-card"
           data-composition-src="compositions/scene-02-title-card.html"
           data-start="94.5" data-duration="4.5" data-track-index="2"></div>

      <!-- Captions overlay (full master, but only first 99s plays in preview) -->
      <div id="captions" class="scene-layer clip" data-composition-id="captions"
           data-composition-src="compositions/captions.html"
           data-start="0" data-duration="99" data-track-index="50"></div>

      <!-- Section 01+02 narration audio (cold open audio + 4.5s silence for title card) -->
      <audio id="narration" data-start="0" data-duration="99" data-track-index="100"
             src="assets/narration/narration.fullscale.wav"></audio>

      <!-- Global film grain + vignette -->
      <div id="grain"></div>
      <div id="vignette"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // Single-scene preview — no crossfade needed.
        // Sub-composition (scene-01-cold-open) registers its own timeline via window.__timelines.
        window.__timelines["mark-hanna-s01-preview"] = tl;
      </script>
    </div>
  </body>
</html>
